
name: Verify NHL API

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify REG, OT and SO games
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import date, timedelta
          from urllib.request import Request, urlopen

          BASE = "https://api-web.nhle.com/v1"
          REQUIRED = {"REG", "OT", "SO"}
          found = {}

          def get_json(url):
              request = Request(
                  url, headers={"User-Agent": "hockey-model-backtest/1.0"}
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          today = date.today()

          for offset in range(1, 46):
              day = today - timedelta(days=offset)
              board = get_json(f"{BASE}/score/{day.isoformat()}")

              for game in board.get("games", []):
                  if game.get("gameState") not in {"OFF", "FINAL"}:
                      continue

                  outcome = game.get("gameOutcome") or {}
                  decided_in = outcome.get("lastPeriodType")

                  if decided_in not in REQUIRED or decided_in in found:
                      continue

                  game_id = game["id"]
                  home_id = game["homeTeam"]["id"]
                  away_id = game["awayTeam"]["id"]

                  data = get_json(
                      f"{BASE}/gamecenter/{game_id}/play-by-play"
                  )

                  if "plays" not in data:
                      raise SystemExit(f"Missing plays for {game_id}")

                  home_goals = 0
                  away_goals = 0

                  for play in data["plays"]:
                      period = play.get(
                          "periodDescriptor", {}
                      ).get("number")

                      if play.get("typeDescKey") != "goal":
                          continue
                      if not isinstance(period, int) or period > 3:
                          continue

                      team_id = play.get(
                          "details", {}
                      ).get("eventOwnerTeamId")

                      if team_id == home_id:
                          home_goals += 1
                      elif team_id == away_id:
                          away_goals += 1

                  tied = home_goals == away_goals

                  if decided_in == "REG" and tied:
                      raise SystemExit(
                          f"REG game unexpectedly tied: {game_id}"
                      )

                  if decided_in in {"OT", "SO"} and not tied:
                      raise SystemExit(
                          f"{decided_in} game not tied after 60 min: {game_id}"
                      )

                  found[decided_in] = (
                      day.isoformat(), game_id,
                      home_goals, away_goals
                  )

                  print(
                      f"{decided_in}: {day} game {game_id}, "
                      f"60-minute score {home_goals}-{away_goals}"
                  )

                  time.sleep(0.2)

              if found.keys() == REQUIRED:
                  break

          missing = REQUIRED - found.keys()
          if missing:
              raise SystemExit(
                  f"Could not verify these game types: {sorted(missing)}"
              )

          print("\nSUCCESS: REG, OT and SO all verified.")
          PY
