
name: Run HockeyAllsvenskan V5 AI Model

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V5 AI backtest
        run: |
          python -m src.hockey_backtest_v5 \
            --input data/ha_matches.csv \
            --output v5_predictions.csv

      - name: Upload V5 predictions
        uses: actions/upload-artifact@v4
        with:
          name: hockey-allsvenskan-v5-predictions
          path: v5_predictions.csv
          retention-days: 90
