
name: Diagnose SharpPick SHL historical odds

on:
  workflow_dispatch:

jobs:
  diagnose-sharppick:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Inspect SharpPick SHL archive
        run: |
          mkdir -p artifacts

          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://sharppick.app"
          ARCHIVE = (
              "https://sharppick.app/en/league/sweden-shl/"
          )

          output = []

          def log(message):
              print(message)
              output.append(str(message))

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/131.0.0.0 "
                  "Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,*/*;q=0.8"
              ),
              "Accept-Language": "en-US,en;q=0.9"
          })

          response = session.get(
              ARCHIVE,
              timeout=30
          )

          Path(
              "artifacts/sharppick_archive.html"
          ).write_text(
              response.text,
              encoding="utf-8"
          )

          log(f"ARCHIVE_STATUS: {response.status_code}")
          log(f"FINAL_URL: {response.url}")
          log(f"HTML_LENGTH: {len(response.text)}")

          response.raise_for_status()

          soup = BeautifulSoup(
              response.text,
              "html.parser"
          )

          title = (
              soup.title.get_text(" ", strip=True)
              if soup.title else ""
          )

          log(f"PAGE_TITLE: {title}")

          page_text = soup.get_text(" ", strip=True)

          log("ARCHIVE_SUMMARY:")
          for term in [
              "games archived",
              "snapshots",
              "moneyline",
              "opening line",
              "closing line"
          ]:
              match = re.search(
                  rf".{{0,100}}{re.escape(term)}.{{0,180}}",
                  page_text,
                  re.IGNORECASE
              )
              if match:
                  log(match.group(0))

          # Collect internal links from the archive.
          links = []
          seen = set()

          for anchor in soup.select("a[href]"):
              href = anchor.get("href", "").strip()
              label = anchor.get_text(" ", strip=True)

              if not href:
                  continue

              url = urljoin(BASE, href)
              parsed = urlparse(url)

              if parsed.netloc != "sharppick.app":
                  continue

              if url in seen:
                  continue

              seen.add(url)

              links.append({
                  "label": label,
                  "url": url,
                  "path": parsed.path
              })

          log(f"INTERNAL_LINK_COUNT: {len(links)}")

          candidates = []

          for item in links:
              path = item["path"].lower()
              label = item["label"].lower()

              if any(
                  word in path or word in label
                  for word in [
                      "game",
                      "match",
                      "event",
                      "odds",
                      "line"
                  ]
              ):
                  candidates.append(item)

          log(f"DETAIL_CANDIDATES: {len(candidates)}")

          for item in candidates[:30]:
              log(
                  "CANDIDATE: "
                  + item["label"]
                  + " | "
                  + item["url"]
              )

          # Inspect embedded data and script references.
          scripts = soup.find_all("script")
          log(f"SCRIPT_COUNT: {len(scripts)}")

          for index, script in enumerate(scripts):
              src = script.get("src")

              if src:
                  log(
                      "SCRIPT_SRC: "
                      + urljoin(BASE, src)
                  )

              script_text = script.string or script.get_text()

              if not script_text:
                  continue

              if any(
                  term in script_text.lower()
                  for term in [
                      "odds",
                      "snapshot",
                      "moneyline",
                      "gameid",
                      "eventid"
                  ]
              ):
                  filename = (
                      f"artifacts/embedded_script_{index}.txt"
                  )

                  Path(filename).write_text(
                      script_text,
                      encoding="utf-8"
                  )

                  log(
                      f"ODDS_SCRIPT_FOUND: {filename}"
                  )
                  log(
                      "SCRIPT_PREVIEW: "
                      + script_text[:2500]
                  )

          # Inspect a small number of likely match pages.
          inspected = 0

          for item in candidates:
              if inspected >= 3:
                  break

              url = item["url"]

              if url.rstrip("/") == ARCHIVE.rstrip("/"):
                  continue

              inspected += 1
              log("")
              log("=" * 60)
              log(f"DETAIL_PAGE_{inspected}: {url}")

              try:
                  time.sleep(2)

                  detail_response = session.get(
                      url,
                      timeout=30
                  )

                  log(
                      "DETAIL_STATUS: "
                      + str(detail_response.status_code)
                  )

                  if detail_response.status_code != 200:
                      continue

                  filename = (
                      f"artifacts/detail_{inspected}.html"
                  )

                  Path(filename).write_text(
                      detail_response.text,
                      encoding="utf-8"
                  )

                  detail_soup = BeautifulSoup(
                      detail_response.text,
                      "html.parser"
                  )

                  detail_title = (
                      detail_soup.title.get_text(
                          " ", strip=True
                      )
                      if detail_soup.title else ""
                  )

                  log(f"DETAIL_TITLE: {detail_title}")

                  detail_text = detail_soup.get_text(
                      " ", strip=True
                  )

                  log(
                      "DETAIL_TEXT: "
                      + detail_text[:5000]
                  )

                  for term in [
                      "home",
                      "away",
                      "moneyline",
                      "opening",
                      "closing",
                      "snapshot",
                      "odds"
                  ]:
                      matches = re.findall(
                          rf".{{0,100}}{re.escape(term)}"
                          rf".{{0,180}}",
                          detail_text,
                          re.IGNORECASE
                      )

                      for match in matches[:5]:
                          log(
                              f"DETAIL_{term.upper()}: "
                              + match
                          )

              except Exception as error:
                  log(f"DETAIL_ERROR: {error}")

          # Save machine-readable link inventory.
          Path(
              "artifacts/sharppick_links.json"
          ).write_text(
              json.dumps(
                  links,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path(
              "artifacts/sharppick_diagnostic.txt"
          ).write_text(
              "\n".join(output),
              encoding="utf-8"
          )

          log("DIAGNOSTIC_FINISHED")
          PY

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharppick-shl-diagnostic
          path: artifacts/
          if-no-files-found: warn
