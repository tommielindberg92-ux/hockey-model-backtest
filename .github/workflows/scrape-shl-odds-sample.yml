
name: Test BetExplorer historical SHL match odds

on:
  workflow_dispatch:

jobs:
  test-match-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Inspect historical match pages
        run: |
          mkdir -p artifacts

          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from pathlib import Path
          import re
          import time

          base = "https://www.betexplorer.com"
          archive = (
              "https://www.betexplorer.com/"
              "hockey/sweden/shl-2024-2025/results/"
          )

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
              ),
              "Accept-Language": "en-US,en;q=0.9"
          })

          output = []

          def log(value):
              print(value)
              output.append(str(value))

          response = session.get(archive, timeout=30)
          log(f"ARCHIVE_STATUS: {response.status_code}")
          response.raise_for_status()

          soup = BeautifulSoup(response.text, "html.parser")

          matches = []
          seen = set()

          for link in soup.select("a[href]"):
              href = link.get("href", "")

              if not re.search(
                  r"/hockey/sweden/shl-2024-2025/.+/",
                  href
              ):
                  continue

              if href in seen:
                  continue

              seen.add(href)
              label = link.get_text(" ", strip=True)

              if not label:
                  continue

              matches.append((label, base + href))

              if len(matches) >= 8:
                  break

          log(f"MATCH_LINKS_FOUND: {len(matches)}")

          for index, (label, url) in enumerate(matches, 1):
              log("")
              log("=" * 70)
              log(f"MATCH_{index}: {label}")
              log(f"URL: {url}")

              try:
                  page = session.get(url, timeout=30)
                  log(f"HTTP_STATUS: {page.status_code}")
                  log(f"FINAL_URL: {page.url}")

                  detail = BeautifulSoup(page.text, "html.parser")
                  title = detail.title.get_text(
                      " ", strip=True
                  ) if detail.title else ""

                  log(f"TITLE: {title}")

                  text = detail.get_text(" ", strip=True)
                  log(f"PAGE_TEXT_LENGTH: {len(text)}")
                  log(f"PAGE_TEXT: {text[:7000]}")

                  odds_terms = re.findall(
                      r".{0,100}(?:odds|bookmaker|1x2|"
                      r"opening|closing|1\s+X\s+2).{0,180}",
                      text,
                      flags=re.IGNORECASE
                  )

                  log("ODDS_RELEVANT_TEXT:")
                  for item in odds_terms[:30]:
                      log(item)

                  filename = f"match_{index}.html"
                  Path("artifacts", filename).write_text(
                      page.text,
                      encoding="utf-8"
                  )

              except Exception as error:
                  log(f"MATCH_ERROR: {error}")

              time.sleep(2)

          Path(
              "artifacts/betexplorer_match_pages.txt"
          ).write_text("\n".join(output), encoding="utf-8")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: betexplorer-match-page-test
          path: artifacts/
          if-no-files-found: warn
