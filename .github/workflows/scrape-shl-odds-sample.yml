
name: Test School of Odds historical SHL data

on:
  workflow_dispatch:

jobs:
  scrape-school-of-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Inspect SHL archive and match odds
        run: |
          mkdir -p artifacts

          python - <<'PY'
          import csv
          import json
          import re
          import time
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          BASE = "https://odds.school"
          ARCHIVES = [
              (
                  BASE
                  + "/ice_hockey/"
                  + "icehockey_sweden_hockey_league/archive"
              ),
              (
                  BASE
                  + "/ice_hockey/"
                  + "icehockey_sweden_hockey_league/archive/2"
              ),
          ]

          OUT = Path("artifacts")
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/131.0.0.0 "
                  "Safari/537.36"
              ),
              "Accept-Language": "en-US,en;q=0.9"
          })

          log_lines = []
          matches = []
          seen = set()

          def log(value):
              print(value)
              log_lines.append(str(value))

          def get_page(url):
              response = session.get(url, timeout=30)
              log(
                  f"HTTP {response.status_code}: {response.url}"
              )
              response.raise_for_status()
              return response

          # 1. Read the public SHL archive.
          for page_number, archive_url in enumerate(
              ARCHIVES, start=1
          ):
              log("")
              log(f"ARCHIVE_PAGE_{page_number}: {archive_url}")

              try:
                  response = get_page(archive_url)

                  Path(
                      OUT / f"archive_{page_number}.html"
                  ).write_text(
                      response.text,
                      encoding="utf-8"
                  )

                  soup = BeautifulSoup(
                      response.text, "html.parser"
                  )

                  archive_text = soup.get_text(
                      " ", strip=True
                  )

                  log(
                      "ARCHIVE_TEXT: "
                      + archive_text[:2500]
                  )

                  prefix = (
                      "/ice_hockey/"
                      "icehockey_sweden_hockey_league/"
                  )

                  for anchor in soup.select("a[href]"):
                      href = anchor.get("href", "")
                      label = anchor.get_text(
                          " ", strip=True
                      )

                      if prefix not in href:
                          continue

                      if "/archive" in href:
                          continue

                      url = urljoin(BASE, href)

                      if url in seen:
                          continue

                      seen.add(url)

                      matches.append({
                          "label": label,
                          "url": url
                      })

              except Exception as error:
                  log(
                      f"ARCHIVE_ERROR: {error}"
                  )

          log("")
          log(f"UNIQUE_MATCH_LINKS: {len(matches)}")

          # Save the discovered match list.
          with open(
              OUT / "shl_match_links.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as file:
              writer = csv.DictWriter(
                  file,
                  fieldnames=["label", "url"]
              )
              writer.writeheader()
              writer.writerows(matches)

          # 2. Inspect a small sample of individual matches.
          raw_rows = []
          match_summaries = []

          for index, match in enumerate(matches[:8], 1):
              url = match["url"]

              log("")
              log("=" * 70)
              log(f"MATCH_{index}: {match['label']}")
              log(f"URL: {url}")

              try:
                  time.sleep(2)

                  response = get_page(url)

                  filename = (
                      OUT / f"match_{index}.html"
                  )

                  filename.write_text(
                      response.text,
                      encoding="utf-8"
                  )

                  soup = BeautifulSoup(
                      response.text,
                      "html.parser"
                  )

                  title = (
                      soup.title.get_text(
                          " ", strip=True
                      )
                      if soup.title else ""
                  )

                  text = soup.get_text(
                      " ", strip=True
                  )

                  log(f"TITLE: {title}")
                  log(
                      "PAGE_TEXT_LENGTH: "
                      + str(len(text))
                  )
                  log(
                      "PAGE_TEXT: "
                      + text[:6500]
                  )

                  # Record every HTML table row without
                  # assuming that 2-way and 3-way markets
                  # have the same settlement rules.
                  tables = soup.find_all("table")

                  log(
                      f"HTML_TABLE_COUNT: {len(tables)}"
                  )

                  for table_index, table in enumerate(
                      tables, 1
                  ):
                      for row_index, tr in enumerate(
                          table.find_all("tr"), 1
                      ):
                          cells = [
                              cell.get_text(
                                  " ", strip=True
                              )
                              for cell in tr.find_all(
                                  ["th", "td"]
                              )
                          ]

                          if not cells:
                              continue

                          raw_rows.append({
                              "match_url": url,
                              "match_label": match["label"],
                              "table_index": table_index,
                              "row_index": row_index,
                              "cells": json.dumps(
                                  cells,
                                  ensure_ascii=False
                              )
                          })

                          joined = " | ".join(cells)

                          if any(
                              term in joined.lower()
                              for term in [
                                  "pinnacle",
                                  "svenska spel",
                                  "unibet",
                                  "betsson",
                                  "nordicbet",
                                  "updated",
                                  "draw"
                              ]
                          ):
                              log(
                                  "ODDS_TABLE_ROW: "
                                  + joined
                              )

                  # Search the entire page for market
                  # and settlement clues.
                  for term in [
                      "Head to Head",
                      "Other bookmakers",
                      "different number of options",
                      "Draw",
                      "Updated",
                      "Pinnacle",
                      "Svenska Spel",
                      "Unibet"
                  ]:
                      positions = [
                          m.start()
                          for m in re.finditer(
                              re.escape(term),
                              text,
                              re.IGNORECASE
                          )
                      ]

                      for position in positions[:3]:
                          log(
                              f"TERM_{term}: "
                              + text[
                                  max(0, position - 150):
                                  position + 450
                              ]
                          )

                  match_summaries.append({
                      "label": match["label"],
                      "url": url,
                      "title": title,
                      "page_text_length": len(text),
                      "html_tables": len(tables),
                      "status": response.status_code
                  })

              except Exception as error:
                  log(f"MATCH_ERROR: {error}")

          # 3. Export raw table rows for later parsing.
          with open(
              OUT / "shl_odds_raw_rows.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as file:
              fields = [
                  "match_url",
                  "match_label",
                  "table_index",
                  "row_index",
                  "cells"
              ]

              writer = csv.DictWriter(
                  file,
                  fieldnames=fields
              )
              writer.writeheader()
              writer.writerows(raw_rows)

          with open(
              OUT / "shl_match_summaries.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  match_summaries,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          with open(
              OUT / "school_of_odds_diagnostic.txt",
              "w",
              encoding="utf-8"
          ) as file:
              file.write("\n".join(log_lines))

          log("")
          log(f"TOTAL_MATCH_LINKS: {len(matches)}")
          log(f"TOTAL_RAW_TABLE_ROWS: {len(raw_rows)}")
          log("DIAGNOSTIC_FINISHED")
          PY

      - name: Upload diagnostic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-of-odds-shl-test
          path: artifacts/
          if-no-files-found: warn
