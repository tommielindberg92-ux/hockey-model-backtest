
name: Diagnose OddsPortal access

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Diagnose OddsPortal response
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path

          url = "https://www.oddsportal.com/hockey/sweden/shl-2024-2025/results/"
          output = []

          def log(value):
              print(value)
              output.append(str(value))

          with sync_playwright() as p:
              request = p.request.new_context(
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36"
                  )
              )

              try:
                  response = request.get(url, timeout=30000)
                  log(f"REQUEST_STATUS: {response.status}")
                  log(f"FINAL_URL: {response.url}")
                  log(f"SERVER: {response.headers.get('server', 'unknown')}")
                  log(f"CONTENT_TYPE: {response.headers.get('content-type', 'unknown')}")
                  log("BODY_PREVIEW:")
                  log(response.text()[:2000])
              except Exception as error:
                  log(f"REQUEST_ERROR: {error}")

              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              try:
                  response = page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=45000
                  )
                  log(
                      "BROWSER_STATUS: "
                      + (str(response.status) if response else "no response")
                  )
                  log(f"BROWSER_FINAL_URL: {page.url}")
                  log(f"PAGE_TITLE: {page.title()}")
                  log("PAGE_TEXT:")
                  log(page.locator("body").inner_text(timeout=10000)[:2000])
              except Exception as error:
                  log(f"BROWSER_ERROR: {error}")
              finally:
                  browser.close()
                  request.dispose()

          Path("artifacts/oddsportal_diagnostic.txt").write_text(
              "\n".join(output),
              encoding="utf-8"
          )
          PY

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oddsportal-diagnostic
          path: artifacts/
          if-no-files-found: warn
