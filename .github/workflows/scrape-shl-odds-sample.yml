
name: Scrape SHL historical odds sample

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OddsHarvester
        run: |
          python -m pip install --upgrade pip
          python -m pip install "oddsharvester==0.20.0"
          python -m playwright install --with-deps chromium

      - name: Scrape SHL 2024/25 sample
        run: |
          mkdir -p artifacts
          oddsharvester historic \
            --sport ice-hockey \
            --league shl \
            --season 2024-2025 \
            --market 1x2 \
            --period full_time \
            --max-pages 1 \
            --format csv \
            --output artifacts/shl_2024_2025_sample.csv \
            --headless \
            --concurrency 1 \
            --request-delay 2

      - name: Upload sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shl-odds-sample
          path: artifacts/
          if-no-files-found: warn
