
name: Run Davidson 1X2 Model

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Davidson model backtest
        run: |
          python -m src.hockey_backtest_davidson \
            --input data/ha_matches.csv \
            --output davidson_predictions.csv

      - name: Upload Davidson predictions
        uses: actions/upload-artifact@v4
        with:
          name: davidson-1x2-predictions
          path: davidson_predictions.csv
          retention-days: 90
