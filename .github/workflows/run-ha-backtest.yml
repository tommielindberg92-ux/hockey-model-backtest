
name: Backtest HockeyAllsvenskan

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical backtest
        run: |
          python -m src.hockey_backtest \
            --input data/ha_matches.csv \
            --output ha_backtest_predictions.csv

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: hockeyallsvenskan-backtest
          path: ha_backtest_predictions.csv
